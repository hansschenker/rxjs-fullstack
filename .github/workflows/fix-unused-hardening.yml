name: Fix unused hardening symbols

on:
  push:
    branches:
      - feat/external-review-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/external-review-hardening

      - name: Remove dead vendored symbols
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/query/queryClient.ts')
          text = client.read_text()
          text = text.replace(
              'import type {\n  CombineFn,\n  QueriesResults,\n  QueriesStreamOptions,\n} from "./queriesStream";',
              'import type { QueriesResults, QueriesStreamOptions } from "./queriesStream";',
          )
          client.write_text(text)

          stream = Path('src/query/queryStream.ts')
          text = stream.read_text()
          text = text.replace('    const prevOptions = this.options;\n', '')
          stream.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "Unused-symbol cleanup already applied."
            exit 0
          fi
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add src/query/queryClient.ts src/query/queryStream.ts
          git commit -m "feat: remove unused Query Cache symbols" -m "Co-authored-by: OpenAI Codex <codex@openai.com>"
          git push origin HEAD:feat/external-review-hardening
