name: Sync hardening documentation

on:
  push:
    branches:
      - feat/external-review-hardening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/external-review-hardening

      - name: Update canonical documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = "The runtime supports primitives, intrinsic elements, fragments, function components, nested children, and RxJS Observables as live view values. It does not render, subscribe, create DOM, or own lifecycle."
          new = "The intrinsic JSX surface is deliberately typed: standard HTML tag names are accepted, common attributes are explicit, and `data-*` / `aria-*` remain extensibility points, so misspelled tags or unsupported attributes fail typechecking. The runtime supports primitives, intrinsic elements, fragments, function components, nested children, and RxJS Observables as live view values. It does not render, subscribe, create DOM, or own lifecycle."
          if old not in text:
              raise SystemExit('README M01 marker not found')
          readme.write_text(text.replace(old, new, 1))

          claude = Path('CLAUDE.md')
          text = claude.read_text()
          text = text.replace(
              '- `bun run check` — generate routes + typecheck + verify + build both example clients. **This must pass before any change counts as done.**',
              '- `bun run check` — format check + generate routes + typecheck + verify + runtime/client builds. **This must pass before any change counts as done.**\n- `bun run format` — format framework/application TypeScript and JSON with the repository Prettier policy.\n- `bun run format:check` — verify the owned source tree is already formatted.',
              1,
          )
          text = text.replace(
              '- **The JSX runtime creates no DOM and owns no lifecycle.** It only creates/normalizes `ViewChild` descriptions.',
              '- **The JSX runtime creates no DOM and owns no lifecycle.** It only creates/normalizes `ViewChild` descriptions. Standard HTML intrinsic tags and the supported attribute surface are type-checked; `data-*` and `aria-*` remain explicit extensibility points.',
              1,
          )
          text = text.replace(
              '- TypeScript strict; no new `any`; 2-space indent in application/framework files.',
              '- TypeScript strict; no new `any`; `noUnusedLocals` and `noUnusedParameters` stay enabled. Prettier owns application/framework formatting; vendored `src/query/` internals and generated routes keep their source style.',
              1,
          )
          claude.write_text(text)
          PY

      - name: Commit docs and remove one-time workflow
        run: |
          git rm .github/workflows/sync-hardening-docs.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add README.md CLAUDE.md
          git commit -m "feat: document external review hardening guardrails" -m "Co-authored-by: OpenAI Codex <codex@openai.com>"
          git push origin HEAD:feat/external-review-hardening
