# Claude Code agent triggered by @claude mentions in issues and PRs.
# Auth: Claude Pro/Max OAuth token (CLAUDE_CODE_OAUTH_TOKEN secret).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when @claude is mentioned
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max subscription auth. Generate with: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Print the full turn-by-turn JSON execution log in the step output
          show_full_output: true
          # Render a human-readable "Claude Code Report" in the job's Step Summary
          display_report: true
          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          # Model + permissions. bypassPermissions = no confirmation prompts.
          # Only use while you are the sole collaborator with write access.
          claude_args: |
            --model claude-fable-5
            --permission-mode bypassPermissions

      # Recommended if show_full_output is true
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude.outputs.execution_file }}
