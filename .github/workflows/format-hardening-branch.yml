name: Format hardening branch

on:
  push:
    branches:
      - feat/external-review-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/external-review-hardening

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Checkout rxjs-router sibling
        run: |
          git clone --depth 1 https://github.com/hansschenker/rxjs-router ../rxjs-router
          (cd ../rxjs-router && bun install --production)

      - name: Install dependencies
        run: bun install

      - name: Format owned code
        run: bun run format

      - name: Commit formatting baseline
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add src scripts package.json tsconfig.json .prettierrc.json
          git commit -m "feat: normalize project formatting with Prettier" -m "Co-authored-by: OpenAI Codex <codex@openai.com>"
          git push origin HEAD:feat/external-review-hardening
